[project]
name = "scratchformer"
version = "0.1.0"
description = "Encoder-decoder Transformer built from scratch on a custom NumPy autodiff engine"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "torch>=2.0", "matplotlib>=3.7"]

[tool.setuptools]
packages = ["scratchformer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
